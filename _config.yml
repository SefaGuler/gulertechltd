title: Guler Tech Ltd
tagline: Offensive Security Research & Notes
description: >-
  Penetration testing notes and research by Guler Tech Ltd — web, mobile and
  cloud security writeups from real engagements and lab work.
author: Guler Tech Ltd
email: info@gulertech.co.uk
url: "https://gulertech.co.uk"
lang: en

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

permalink: /:collection/:name/
timezone: Europe/London

# Collections = note categories
collections:
  web:
    output: true
    title: Web Application
    icon: "&#60;/&#62;"
    blurb: "XSS, SQLi, SSRF, XXE, SSTI, IDOR, auth & session, request smuggling, business logic."
  mobile:
    output: true
    title: Mobile Application
    icon: "&#9633;"
    blurb: "iOS & Android — static/dynamic analysis, Frida/Objection, SSL pinning & root/jailbreak bypass."
  cloud:
    output: true
    title: Cloud Security
    icon: "&#9729;"
    blurb: "AWS configuration review and assumed-breach testing — IAM, S3, compute, containers, logging and detection."

# Order categories appear on the homepage
category_order: [web, mobile, cloud]

defaults:
  - scope:
      path: ""
      type: web
    values:
      layout: note
      category: web
  - scope:
      path: ""
      type: mobile
    values:
      layout: note
      category: mobile
  - scope:
      path: ""
      type: cloud
    values:
      layout: note
      category: cloud

exclude:
  - README.md
  - publish.sh
  - Gemfile
  - Gemfile.lock
  - vendor
